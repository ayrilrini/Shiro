name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - feat/core-v14-adaptation
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 前端运行时对外地址（NEXT_PUBLIC_* 构建期内联，改域名需同步改这里）
          build-args: |
            BASE_URL=https://www.voidink.tech
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/shiro-v14:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/shiro-v14:${{ github.sha }}
          # 用 GitHub 缓存加速后续构建（apk/pnpm/字体层全部复用）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/shiro-v14:${{ github.sha }}"
