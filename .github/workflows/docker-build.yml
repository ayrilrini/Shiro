name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - feat/core-v14-adaptation
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# ACR_REGISTRY / ACR_NAMESPACE 推荐配成仓库 Variables（非敏感，日志可见便于排查）：
#   ACR_REGISTRY = crpi-xxxx.cn-<region>.personal.cr.aliyuncs.com   ← 仅主机名，不带 https://、不带路径、不带末尾斜杠
#   ACR_NAMESPACE = 控制台「命名空间」名称（逐字符一致）
# 未配置 Variables 时回退读取同名 Secrets。
env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 构建前 30 秒预检：用一个 hello-world 探测推送权限与仓库存在性，
      # 失败立即给出人话报错，避免等待完整构建后在 push 阶段才失败。
      - name: Preflight push permission (fail fast)
        run: |
          REF="${ACR_REGISTRY}/${ACR_NAMESPACE}/shiro-v14:preflight"
          echo "目标仓库: ${ACR_REGISTRY}/${ACR_NAMESPACE}/shiro-v14"
          if ! echo "${ACR_REGISTRY}" | grep -E '^[a-z0-9.-]+$' >/dev/null; then
            echo "::error::ACR_REGISTRY 含有多余内容（应仅为主机名，不带 https://、路径或斜杠）: ${ACR_REGISTRY}"
            exit 1
          fi
          if ! echo "${ACR_NAMESPACE}" | grep -E '^[a-z0-9_-]+$' >/dev/null; then
            echo "::error::ACR_NAMESPACE 含有非法字符（应为纯命名空间名，不含斜杠）: ${ACR_NAMESPACE}"
            exit 1
          fi
          docker pull hello-world >/dev/null
          docker tag hello-world "${REF}"
          if ! docker push "${REF}"; then
            echo "::error::推送被拒（insufficient_scope）。请依次检查：1) ACR 控制台已手动创建仓库 shiro-v14（新版个人实例不会自动创建）；2) 命名空间与控制台逐字符一致；3) ACR_USERNAME 为「访问凭证」页显示的用户名（新版实例通常形如 crpi-xxxx，而非阿里云邮箱）"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 阿里云 ACR 不接受 OCI attestation 的 application/vnd.oci.empty.v1+json
          # （denied: unknown manifest class），必须禁用 provenance 证明
          provenance: false
          # 前端运行时对外地址（NEXT_PUBLIC_* 构建期内联，改域名需同步改这里）
          build-args: |
            BASE_URL=https://www.voidink.tech
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/shiro-v14:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/shiro-v14:${{ github.sha }}
          # 用 GitHub 缓存加速后续构建（apk/pnpm/字体层全部复用）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/shiro-v14:${{ github.sha }}"
